<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1410px" preserveAspectRatio="none" style="width:254px;height:1410px;background:#FFFFFF;" version="1.1" viewBox="0 0 254 1410" width="254px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="197.0117" x="25.1792" y="23.5352">OpenGL Rendering Pipeline</text></g><!--entity VSPEC--><g class="entity" data-qualified-name="VSPEC" data-source-line="6" id="ent0001"><rect fill="#FFFFE0" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="209.6152" x="18.88" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.4824" x="28.88" y="68.0234">1. Vertex Specification</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="28.88" y="84.5117">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.7256" x="28.88" y="101">Receives raw vertex data:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.7354" x="28.88" y="117.4883">positions, colors, normals,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.6152" x="28.88" y="133.9766">texture coordinates, indices</text></g><!--entity VSHADER--><g class="entity" data-qualified-name="VSHADER" data-source-line="8" id="ent0002"><rect fill="#ADD8E6" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="189.3672" x="29" y="206.9283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.7451" x="39" y="230.4634">2. Vertex Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="39" y="246.9517">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.0801" x="39" y="263.44">Runs once per vertex.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.249" x="39" y="279.9283">Applies transformations</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.3672" x="39" y="296.4166">(model/view/projection).</text></g><!--entity TESS--><g class="entity" data-qualified-name="TESS" data-source-line="10" id="ent0003"><rect fill="#D3D3D3" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="192.6484" x="27.36" y="369.3783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="98.834" x="37.36" y="392.9134">3. Tessellation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="37.36" y="409.4017">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.5303" x="37.36" y="425.89">Optional stage.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.6484" x="37.36" y="442.3783">Subdivides geometry into</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.1934" x="37.36" y="458.8666">smaller pieces for detail.</text></g><!--entity GSHADER--><g class="entity" data-qualified-name="GSHADER" data-source-line="12" id="ent0004"><rect fill="#D3D3D3" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="164.2246" x="41.57" y="531.8183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.1074" x="51.57" y="555.3534">4. Geometry Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="51.57" y="571.8417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.5303" x="51.57" y="588.33">Optional stage.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.2822" x="51.57" y="604.8183">Can create, modify,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.2246" x="51.57" y="621.3066">or discard primitives.</text></g><!--entity VPOST--><g class="entity" data-qualified-name="VPOST" data-source-line="14" id="ent0005"><rect fill="#FFFFE0" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="233.3701" x="7" y="694.2583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.0322" x="17" y="717.7934">5. Vertex Post-Processing</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="17" y="734.2817">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.3701" x="17" y="750.77">Performs clipping and prepares</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.9775" x="17" y="767.2583">vertices for assembly.</text></g><!--entity PRIM--><g class="entity" data-qualified-name="PRIM" data-source-line="16" id="ent0006"><rect fill="#FFFFE0" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.2891" x="26.54" y="840.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.0771" x="36.54" y="863.7434">6. Primitive Assembly</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="36.54" y="880.2317">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.6777" x="36.54" y="896.72">Groups vertices into</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.2891" x="36.54" y="913.2083">triangles, lines, or points.</text></g><!--entity RAST--><g class="entity" data-qualified-name="RAST" data-source-line="18" id="ent0007"><rect fill="#FFFFE0" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="212.2881" x="17.54" y="986.1583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.5723" x="27.54" y="1009.6934">7. Rasterization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="27.54" y="1026.1817">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.7227" x="27.54" y="1042.67">Converts primitives into</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.2881" x="27.54" y="1059.1583">fragments (potential pixels).</text></g><!--entity FSHADER--><g class="entity" data-qualified-name="FSHADER" data-source-line="20" id="ent0008"><rect fill="#ADD8E6" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="174.8887" x="36.24" y="1132.1183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.9316" x="46.24" y="1155.6534">8. Fragment Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="46.24" y="1172.1417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.127" x="46.24" y="1188.63">Runs per fragment.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.8887" x="46.24" y="1205.1183">Determines final color,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.7139" x="46.24" y="1221.6066">lighting, textures.</text></g><!--entity PSAMPLE--><g class="entity" data-qualified-name="PSAMPLE" data-source-line="22" id="ent0009"><rect fill="#FFFFE0" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="211.7412" x="17.81" y="1294.5583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.1641" x="27.81" y="1318.0934">9. Per-Sample Operations</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="27.81" y="1334.5817">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.7559" x="27.81" y="1351.07">Depth testing,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.8594" x="27.81" y="1367.5583">stencil testing,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="191.7412" x="27.81" y="1384.0466">blending, framebuffer write.</text></g><!--link VSPEC to VSHADER--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="24" id="lnk10"><path d="M123.69,147.1083 C123.69,166.0683 123.69,182.5483 123.69,201.5283" fill="none" id="VSPEC-to-VSHADER" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,206.5283,127.69,197.5283,123.69,201.5283,119.69,197.5283,123.69,206.5283" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link VSHADER to TESS--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="25" id="lnk11"><path d="M123.69,309.5483 C123.69,328.5083 123.69,344.9883 123.69,363.9783" fill="none" id="VSHADER-to-TESS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,368.9783,127.69,359.9783,123.69,363.9783,119.69,359.9783,123.69,368.9783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link TESS to GSHADER--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk12"><path d="M123.69,471.9883 C123.69,490.9583 123.69,507.4383 123.69,526.4183" fill="none" id="TESS-to-GSHADER" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,531.4183,127.69,522.4183,123.69,526.4183,119.69,522.4183,123.69,531.4183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GSHADER to VPOST--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="27" id="lnk13"><path d="M123.69,634.3783 C123.69,653.6583 123.69,670.3583 123.69,688.8383" fill="none" id="GSHADER-to-VPOST" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,693.8383,127.69,684.8383,123.69,688.8383,119.69,684.8383,123.69,693.8383" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link VPOST to PRIM--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="28" id="lnk14"><path d="M123.69,780.6283 C123.69,799.3683 123.69,816.2383 123.69,834.9583" fill="none" id="VPOST-to-PRIM" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,839.9583,127.69,830.9583,123.69,834.9583,119.69,830.9583,123.69,839.9583" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link PRIM to RAST--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="29" id="lnk15"><path d="M123.69,926.5783 C123.69,945.3183 123.69,962.1883 123.69,980.9083" fill="none" id="PRIM-to-RAST" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,985.9083,127.69,976.9083,123.69,980.9083,119.69,976.9083,123.69,985.9083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link RAST to FSHADER--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="30" id="lnk16"><path d="M123.69,1072.4983 C123.69,1090.9383 123.69,1107.5883 123.69,1126.8283" fill="none" id="RAST-to-FSHADER" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,1131.8283,127.69,1122.8283,123.69,1126.8283,119.69,1122.8283,123.69,1131.8283" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link FSHADER to PSAMPLE--><g class="link" data-entity-1="ent0008" data-entity-2="ent0009" data-link-type="dependency" data-source-line="31" id="lnk17"><path d="M123.69,1234.7383 C123.69,1253.6983 123.69,1270.1783 123.69,1289.1583" fill="none" id="FSHADER-to-PSAMPLE" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.69,1294.1583,127.69,1285.1583,123.69,1289.1583,119.69,1285.1583,123.69,1294.1583" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src VLHBRzim3BxxLn3TfGCI5ti_3WEoDiq6jAWH5mK6vABOJC9DbWH9IPh--f6sd2OjMlXWovRuFVZHaQ96k75e9bSmHLEZ9xE4WXngCfXbuHyPfxngGDPnvn2iZokRHUiWMfZR66q3DNci8bcJPVAWp9BBdhpBuGvzn7ie7LQqe4h9dXbVKwoGDXZ0gorikasrYkhxp3WRIBQ50LHMMyztOtsZT1ZC3E-BQu_ynVgQZ8h8dydKL64u0HNWhYp6v_3cYfQh-0UrjjiZIkyVAQqKgssvh4q0Qoe4XpwHoMTcv9mcPXYzCc4X35fMCtFQs1hrsOPmU-Qy_TifVvid_5-ZY_4qCVYfrtY4_o67Mmo1YUsjk77of3I4g9R8mELwNjE6QiPUecqm-XrBZ7Pc0hkWcQCZjYy0au8QeoBTOT-Eop81JxpQ7G5_p67I5tkK_WpxN1ceFBAl0s2PjDYnwG93eLA-1kUfuUvmvph8oP7SPwYVzdONDiHXuItp3Xmn0I_GYwq1AatEIUwK4GJam27xB9sWNgTYqvgvtYMNYvlozkKkVywXw8d2A9qKo8ctQnTWNxcpDNfg3tAK9ELyOq1d-MDIMKn_Nx-CzYM7gGgHH-TXtzHpsz8F1uObi8LNomQvD9mw6_c1s7v7zwX3Yj1qz9gshpbSfX9FCopnxSjpBo-GEJKY21OaJMx7YVkffJJxFO0qJadcvUlP_SQkeX-Mgd7TJyFt4o5OBgwuN6ZhSb9PMKNwuCrSy--b1MMA3SxNYmNJtNgAc4mkHzV5rV