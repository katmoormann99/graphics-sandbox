<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="518px" preserveAspectRatio="none" style="width:927px;height:518px;background:#FFFFFF;" version="1.1" viewBox="0 0 927 518" width="927px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="186.5527" x="367.0523" y="23.5352">OpenGL Graphics Pipeline</text></g><!--entity VSPEC--><g class="entity" data-qualified-name="VSPEC" data-source-line="6" id="ent0001"><rect fill="#FFFFE0" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="208.9727" x="30.28" y="52.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.4824" x="40.28" y="76.2634">1. Vertex Specification</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="40.28" y="92.7517">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.9727" x="40.28" y="109.24">Mesh data loaded from OBJ:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.8672" x="40.28" y="125.7283">Vertices, Normals, UVs,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.6875" x="40.28" y="142.2166">Indices</text></g><!--entity VSHADER--><g class="entity" data-qualified-name="VSHADER" data-source-line="8" id="ent0002"><rect fill="#ADD8E6" height="118.9297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="215.8018" x="273.86" y="44.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.7451" x="283.86" y="68.0234">2. Vertex Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="283.86" y="84.5117">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.0801" x="283.86" y="101">Runs once per vertex.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.1836" x="283.86" y="117.4883">Model * View * Projection</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.9365" x="283.86" y="133.9766">transformations.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.8018" x="283.86" y="150.4648">Outputs Clip-Space Position.</text></g><!--entity TESS--><g class="entity" data-qualified-name="TESS" data-source-line="10" id="ent0003"><rect fill="#D3D3D3" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="169.5635" x="524.98" y="52.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.5635" x="534.98" y="76.2634">3. Tessellation Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.1426" x="534.98" y="92.7517">(Optional)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="534.98" y="109.24">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.5107" x="534.98" y="125.7283">Subdivide geometry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.1885" x="534.98" y="142.2166">for additional detail.</text></g><!--entity GSHADER--><g class="entity" data-qualified-name="GSHADER" data-source-line="12" id="ent0004"><rect fill="#D3D3D3" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="164.2246" x="729.65" y="52.7283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.1074" x="739.65" y="76.2634">4. Geometry Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.1426" x="739.65" y="92.7517">(Optional)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="739.65" y="109.24">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.2617" x="739.65" y="125.7283">Create, modify,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.2246" x="739.65" y="142.2166">or discard primitives.</text></g><!--entity CLIP--><g class="entity" data-qualified-name="CLIP" data-source-line="14" id="ent0005"><rect fill="#FFFFE0" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="203.7773" x="709.88" y="223.4183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.5801" x="719.88" y="246.9534">5. Clipping</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="719.88" y="263.4417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.9219" x="719.88" y="279.93">Clip primitives against</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.0801" x="719.88" y="296.4183">view frustum planes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.7773" x="719.88" y="312.9066">May generate new vertices.</text></g><!--entity PDIV--><g class="entity" data-qualified-name="PDIV" data-source-line="16" id="ent0006"><rect fill="#FFFFE0" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="205.0283" x="470.25" y="223.4183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.0938" x="480.25" y="246.9534">6. Perspective Divide</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="480.25" y="263.4417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7666" x="480.25" y="279.93">(x,y,z,w) -&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.2773" x="480.25" y="296.4183">(x/w,y/w,z/w)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="185.0283" x="480.25" y="312.9066">Produces NDC coordinates.</text></g><!--entity VIEWPORT--><g class="entity" data-qualified-name="VIEWPORT" data-source-line="18" id="ent0007"><rect fill="#FFFFE0" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="209.8271" x="225.85" y="231.6583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.9883" x="235.85" y="255.1934">7. Viewport Transform</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="235.85" y="271.6817">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.8271" x="235.85" y="288.17">NDC -&gt; Screen Coordinates</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.0615" x="235.85" y="304.6583">Maps [-1,1] to pixels.</text></g><!--entity PRIM--><g class="entity" data-qualified-name="PRIM" data-source-line="20" id="ent0008"><rect fill="#FFFFE0" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="171.1699" x="20.18" y="223.4183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.0771" x="30.18" y="246.9534">8. Primitive Assembly</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="30.18" y="263.4417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.7959" x="30.18" y="279.93">Index buffer groups</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.1699" x="30.18" y="296.4183">vertices into triangles,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.2852" x="30.18" y="312.9066">lines, or points.</text></g><!--entity RAST--><g class="entity" data-qualified-name="RAST" data-source-line="22" id="ent0009"><rect fill="#FFFFE0" height="118.9297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="197.5293" x="7" y="385.8583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.5723" x="17" y="409.3934">9. Rasterization</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="17" y="425.8817">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.5293" x="17" y="442.37">Determine covered pixels.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.75" x="17" y="458.8583">Compute barycentric</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.9795" x="17" y="475.3466">coordinates.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.0293" x="17" y="491.8348">Generate fragments.</text></g><!--entity FSHADER--><g class="entity" data-qualified-name="FSHADER" data-source-line="24" id="ent0010"><rect fill="#ADD8E6" height="102.4414" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="161.7842" x="239.87" y="394.0983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.7842" x="249.87" y="417.6334">10. Fragment Shader</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="249.87" y="434.1217">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.127" x="249.87" y="450.61">Runs per fragment.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.8125" x="249.87" y="467.0983">Texture sampling,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.335" x="249.87" y="483.5866">lighting, shading.</text></g><!--entity PFO--><g class="entity" data-qualified-name="PFO" data-source-line="26" id="ent0011"><rect fill="#FFFFE0" height="118.9297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="219.5068" x="437.01" y="385.8583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.5068" x="447.01" y="409.3934">11. Per-Fragment Operations</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="447.01" y="425.8817">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.4775" x="447.01" y="442.37">Depth Test</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="77.9844" x="447.01" y="458.8583">Stencil Test</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.8643" x="447.01" y="475.3466">Blending</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.917" x="447.01" y="491.8348">MSAA</text></g><!--entity FB--><g class="entity" data-qualified-name="FB" data-source-line="28" id="ent0012"><rect fill="#90EE90" height="85.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="178.7852" x="691.37" y="402.3483"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.7236" x="701.37" y="425.8834">12. Framebuffer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="701.37" y="442.3717">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.4521" x="701.37" y="458.86">Final pixel colors</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.7852" x="701.37" y="475.3483">stored in render target.</text></g><!--link VSPEC to VSHADER--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="30" id="lnk13"><path d="M239.51,103.7883 C250.82,103.7883 257.34,103.7883 268.69,103.7883" fill="none" id="VSPEC-to-VSHADER" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="273.69,103.7883,264.69,99.7883,268.69,103.7883,264.69,107.7883,273.69,103.7883" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link VSHADER to TESS--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="31" id="lnk14"><path d="M490.09,103.7883 C501.69,103.7883 508.38,103.7883 519.66,103.7883" fill="none" id="VSHADER-to-TESS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="524.66,103.7883,515.66,99.7883,519.66,103.7883,515.66,107.7883,524.66,103.7883" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link TESS to GSHADER--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="32" id="lnk15"><path d="M694.85,103.7883 C706.27,103.7883 712.98,103.7883 724.36,103.7883" fill="none" id="TESS-to-GSHADER" style="stroke:#181818;stroke-width: